name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # requirements.txt pins an older Anki. The second leg re-runs checks and tests on the
    # newest Anki, whose Python API has dropped or renamed things the pin still has.
    strategy:
      fail-fast: false
      matrix:
        anki: ['pinned', '26.9.3']

    name: test (anki ${{ matrix.anki }})

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y xvfb libgl1-mesa-dev libglib2.0-0 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

    - name: Install newest Anki
      if: matrix.anki != 'pinned'
      # Newer Anki needs protobuf 6+, above the requirements.txt pin.
      run: pip install "anki==${{ matrix.anki }}" "aqt==${{ matrix.anki }}" "protobuf>=6,<8"

    - name: Run code quality checks
      run: ./scripts/build.sh check

    - name: Run tests
      run: |
        export QT_QPA_PLATFORM=offscreen
        export DISPLAY=:99
        xvfb-run -a python -m pytest tests/ -v

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@v4

    - uses: oven-sh/setup-bun@v2

    - run: bun install --frozen-lockfile

    - run: bun run check

    - run: bun test
