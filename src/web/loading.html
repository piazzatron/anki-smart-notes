<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smart Notes</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        color: #f4f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 44%, rgb(74 222 128 / 0.1), transparent 40%), #100f12;
        transition: opacity 0.35s ease-in;
      }
      body.leaving {
        opacity: 0;
      }
      main {
        display: grid;
        justify-items: center;
        text-align: center;
        animation: enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* The mascot (web/src/components/shared/Mascot.tsx): it floats while the app
         downloads, and glances and blinks on its own. */
      .buddy {
        width: 96px;
        height: 96px;
        overflow: visible;
        filter: drop-shadow(0 0 14px rgb(31 212 125 / 0.7));
        animation: float 3.2s ease-in-out infinite;
      }
      .sad,
      .failed .happy {
        display: none;
      }
      .failed .sad {
        display: inline;
      }
      .failed .buddy {
        animation: none;
      }
      .leaving .buddy {
        animation: cheer 0.35s ease-out both;
      }

      h1 {
        margin: 22px 0 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 8px 0 0;
        font-size: 13px;
        color: #a1a1aa;
      }
      button {
        margin-top: 18px;
        padding: 8px 18px;
        border: 0;
        border-radius: 8px;
        background: #4ade80;
        color: #0b1f12;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .bar {
        width: 140px;
        height: 3px;
        margin-top: 18px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #4ade80;
        animation: progress 1.4s ease-in-out infinite;
      }
      .failed .waiting,
      .failed .bar,
      .error {
        display: none;
      }
      .failed .error {
        display: grid;
        justify-items: center;
      }
      .sparkles {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .sparkles span {
        position: absolute;
        color: #4ade80;
        opacity: 0;
        animation: twinkle 2.4s ease-in-out infinite alternate;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes progress {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @keyframes cheer {
        to { transform: translateY(-14px) scale(1.12); }
      }
      @keyframes twinkle {
        from { opacity: 0.15; transform: scale(0.8); }
        to { opacity: 0.9; transform: scale(1.1); }
      }
      @keyframes enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="sparkles" aria-hidden="true">
      <span style="left: 29%; top: 27%; font-size: 9px">✦</span>
      <span style="left: 47%; top: 20%; font-size: 7px; animation-delay: 0.8s">✦</span>
      <span style="left: 68%; top: 31%; font-size: 11px; animation-delay: 0.4s">✦</span>
      <span style="left: 25%; top: 62%; font-size: 7px; animation-delay: 1.3s">✦</span>
      <span style="left: 71%; top: 64%; font-size: 9px; animation-delay: 1.7s">✦</span>
      <span style="left: 58%; top: 76%; font-size: 6px; animation-delay: 0.2s">✦</span>
    </div>

      <h1>Smart Notes</h1>
      <p class="waiting">Getting everything ready…</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <div class="error">
        <p>Couldn't load Smart Notes. Check your internet connection.</p>
        <button id="retry">Try again</button>
      </div>
    </main>
    <script>
      const poll = async () => {
        try {
          const status = await (await fetch("/loading/status")).json()
          if (status.ready) {
            // The app's canvas is this background, so fading out then reloading reads
            // as one hand-over rather than a flash.
            document.body.classList.add("leaving")
            return setTimeout(() => location.reload(), 350)
          }
          document.body.classList.toggle("failed", status.failed)
        } catch {}
        setTimeout(poll, 500)
      }
      document.getElementById("retry").onclick = () => {
        document.body.classList.remove("failed")
        fetch("/loading/retry", { method: "POST" })
      }
      poll()
    </script>
  </body>
</html>
